---
- name: Apply bashrc stow (restow to pick up any changes)
  command:
    cmd: stow -R bashrc
    chdir: "{{ dotfiles_path }}"
  become_user: "{{ ansible_user }}"
  register: bashrc_stow
  changed_when: bashrc_stow.stdout != '' or bashrc_stow.stderr != ''

- name: Check if source line exists in ~/.bashrc
  lineinfile:
    path: "{{ user_home_path }}/.bashrc"
    regexp: '^\s*#?\s*source\s+~/.my_bashrc'
    line: 'source ~/.my_bashrc'
    state: present
  register: bashrc_result
  become_user: "{{ ansible_user }}"


